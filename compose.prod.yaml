x-radar-env: &radar-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://radar:CHANGE_ME@postgres:5432/radar}
  RADAR_HTTP_TIMEOUT: ${RADAR_HTTP_TIMEOUT:-20}
  RADAR_HTTP_USER_AGENT: ${RADAR_HTTP_USER_AGENT:-RadarBot/0.1 (+https://github.com/PedroViana42/Radar)}
  RADAR_SCHEDULER_POLL_SECONDS: ${RADAR_SCHEDULER_POLL_SECONDS:-60}
  RADAR_SCHEDULER_BATCH_SIZE: ${RADAR_SCHEDULER_BATCH_SIZE:-5}
  RADAR_LIFECYCLE_MIN_RESULT_RATIO: ${RADAR_LIFECYCLE_MIN_RESULT_RATIO:-0.20}
  RADAR_SCHEDULER_TIMEZONE: ${RADAR_SCHEDULER_TIMEZONE:-UTC}
  SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}

x-runtime-logging: &runtime-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  searxng:
    image: docker.io/searxng/searxng@sha256:374c5da46d26960bf1132834d05bc2ef2ae57232f7a490e4eac8c8b640fa783d
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET must be configured}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - radar_searxng_cache:/var/cache/searxng
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *runtime-logging
    mem_limit: 384m
    cpus: "0.5"

  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radar}
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    volumes:
      - radar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 1g
    cpus: "2.0"

  migrate:
    image: ${RADAR_IMAGE:-radar:local}
    restart: "no"
    environment:
      <<: *radar-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  bootstrap:
    image: ${RADAR_IMAGE:-radar:local}
    restart: "no"
    environment:
      <<: *radar-env
    command: ["python", "-m", "radar.cli", "bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    image: ${RADAR_IMAGE:-radar:local}
    restart: unless-stopped
    environment:
      <<: *radar-env
    command: ["python", "-m", "radar.cli", "scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
    mem_limit: 512m
    cpus: "1.0"

  api:
    image: ${RADAR_IMAGE:-radar:local}
    restart: unless-stopped
    environment:
      <<: *radar-env
      RADAR_API_HOST: 0.0.0.0
      RADAR_API_PORT: 8000
    command: ["python", "-m", "radar.cli", "api"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *runtime-logging
    mem_limit: 512m
    cpus: "1.0"

  web:
    image: ${RADAR_WEB_IMAGE:-radar-web:local}
    restart: unless-stopped
    environment:
      RADAR_API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *runtime-logging
    mem_limit: 512m
    cpus: "1.0"

volumes:
  radar_postgres_data:
  radar_searxng_cache:
