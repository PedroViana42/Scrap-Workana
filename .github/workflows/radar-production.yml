name: Radar Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: radar_test
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://radar:radar_test@localhost:5432/radar_test
      TEST_DATABASE_URL: postgresql+psycopg://radar:radar_test@localhost:5432/radar_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: python -m compileall radar

      - name: Migrate test database
        run: alembic upgrade head

      - name: Unit tests
        run: pytest -m "not integration and not live" -q

      - name: Integration tests
        run: pytest -m integration -q

      - name: Full test suite
        run: pytest -q

      - name: Summary
        if: always()
        run: |
          {
            echo "## Test"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Python: 3.12"
            echo "- PostgreSQL: 17.6"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build And Push
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_repository: ${{ steps.image.outputs.repository }}
      image_tag: ${{ steps.image.outputs.tag }}
      image_digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve image metadata
        id: image
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE_REPO="ghcr.io/${OWNER}/radar"
          IMAGE_TAG="sha-${GITHUB_SHA}"
          {
            echo "repository=${IMAGE_REPO}"
            echo "tag=${IMAGE_TAG}"
            echo "main_tag=main"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.repository }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## Build"
            echo ""
            echo "- Image: \`${{ steps.image.outputs.repository }}\`"
            echo "- Tags: \`${{ steps.image.outputs.tag }}\`, \`main\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Ref: \`${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs:
      - test
      - build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    concurrency:
      group: radar-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_REPOSITORY: ${{ needs.build.outputs.image_repository }}
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
      IMAGE_REF: ${{ needs.build.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare SSH
        id: ssh
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          KEY_FILE="$RUNNER_TEMP/radar_deploy_key"
          KNOWN_HOSTS_FILE="$RUNNER_TEMP/radar_known_hosts"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$KEY_FILE"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          chmod 600 "$KEY_FILE"
          chmod 644 "$KNOWN_HOSTS_FILE"
          {
            echo "key_file=$KEY_FILE"
            echo "known_hosts_file=$KNOWN_HOSTS_FILE"
          } >> "$GITHUB_OUTPUT"

      - name: Verify SSH and VPS preflight
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
        run: |
          ssh \
            -i "$KEY_FILE" \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            "$VPS_USER@$VPS_HOST" \
            'set -Eeuo pipefail
             echo radar-ssh-ok
             if [ -f /var/run/reboot-required ]; then
               echo "VPS requires reboot before first Radar deployment." >&2
               exit 1
             fi
             docker --version
             docker compose version
             systemctl is-active docker'

      - name: Upload deploy files
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
        run: |
          SSH_OPTS=(-i "$KEY_FILE" -P "$VPS_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_FILE")
          ssh \
            -i "$KEY_FILE" \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            "$VPS_USER@$VPS_HOST" \
            'mkdir -p /opt/radar/deploy'
          scp "${SSH_OPTS[@]}" compose.prod.yaml "$VPS_USER@$VPS_HOST:/opt/radar/deploy/compose.prod.yaml.new"
          scp "${SSH_OPTS[@]}" deploy/remote_deploy.sh "$VPS_USER@$VPS_HOST:/opt/radar/deploy/remote_deploy.sh.new"

      - name: Deploy over SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -i "$KEY_FILE" \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            "$VPS_USER@$VPS_HOST" \
            "bash /opt/radar/deploy/remote_deploy.sh.new '$IMAGE_REF' '${{ github.actor }}' '${{ github.sha }}'"

      - name: Verify production state
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
        run: |
          ssh \
            -i "$KEY_FILE" \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            "$VPS_USER@$VPS_HOST" \
            'set -Eeuo pipefail
             export RADAR_IMAGE="$(cat /opt/radar/deploy/current_image)"
             docker compose -p radar --env-file /opt/radar/.env -f /opt/radar/compose.prod.yaml ps
             docker compose -p radar --env-file /opt/radar/.env -f /opt/radar/compose.prod.yaml exec -T scheduler python -m radar.cli db-check
             docker compose -p radar --env-file /opt/radar/.env -f /opt/radar/compose.prod.yaml exec -T scheduler python -m radar.cli scheduler-status'

      - name: Summary
        run: |
          {
            echo "## Deploy"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Image: \`${IMAGE_REPOSITORY}\`"
            echo "- Tag: \`${IMAGE_TAG}\`"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
            echo "- Image ref: \`${IMAGE_REF}\`"
            echo "- Host: configured via \`VPS_HOST\`"
            echo "- Environment: \`production\`"
            echo "- Status: deployed"
          } >> "$GITHUB_STEP_SUMMARY"
